name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
        platform: [x64]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Platform-specific Qt setup ---
      - name: Setup Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Setup Qt + Ninja (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      # --- Common ---
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Update dependencies and configure
        run: make update

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Run Non-GPU Tests
        working-directory: build
        run: ctest -C ${{ matrix.configuration }} --output-on-failure
