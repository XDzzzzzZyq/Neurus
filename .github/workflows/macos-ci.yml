name: macOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64]

    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt6 and Ninja
        run: |
          brew install qt ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> $GITHUB_ENV

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.341.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Fetch pre-compiled dependencies
        run: python scripts/setup_dependencies.py
        continue-on-error: true

      - name: Sync shaderc dependencies (fallback)
        run: |
          cd dep/shaderc
          python3 utils/git-sync-deps

      - name: Set build directory
        run: |
          BUILD_SUBDIR=${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
          CMAKE_PRESET=${{ matrix.configuration == 'Debug' && 'macos' || 'macos-release' }}
          echo "BUILD_DIR=build/${BUILD_SUBDIR}" >> $GITHUB_ENV
          echo "CMAKE_PRESET=${CMAKE_PRESET}" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake --preset ${{ env.CMAKE_PRESET }} -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --parallel

      - name: Run Non-GPU Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure -E "Vulkan|Shader|Swapchain|Renderer"
